name: Update episodes

on:
  schedule:
    - cron: "30 20 * * *"   # every day 20:30 UTC = 04:30 Singapore / Beijing time
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:                 # a second run (e.g. "Run workflow" clicked twice) waits for the first instead of clashing with it
  group: update-episodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Fetch podcast feeds
        run: python tools/fetch_feeds.py
      - name: Install transcript tools
        id: tools
        continue-on-error: true
        run: pip install -r tools/requirements.txt
      - name: Cache speech, translation and dictionary models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ecdict
          key: models-whisper-nllb-ecdict-v1
      - name: Build transcripts (timing, Chinese, vocabulary)
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 80        # stop here if it runs long, so the finished transcripts still get committed
        env:
          TX_BUDGET_MIN: "60"
        run: python tools/build_transcripts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update episodes $(date -u +%F)"
            git push
          fi
