name: Update episodes

on:
  schedule:
    - cron: "30 20 * * *"   # every day 20:30 UTC = 04:30 Singapore / Beijing time
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch podcast feeds
        run: python tools/fetch_feeds.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update episodes $(date -u +%F)"
            git push
          fi
