name: Update episodes

on:
  schedule:
    - cron: "30 20 * * *"   # every day 20:30 UTC = 04:30 Singapore / Beijing time
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Fetch podcast feeds
        run: python tools/fetch_feeds.py
      - name: Install transcript tools
        id: tools
        continue-on-error: true
        run: pip install -r tools/requirements.txt
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small.en-v1
      - name: Build transcripts (timing, Chinese, vocabulary)
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        env:
          TX_BUDGET_MIN: "75"
        run: python tools/build_transcripts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if [ -f tools/gloss_cache.json ]; then git add tools/gloss_cache.json; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update episodes $(date -u +%F)"
            git push
          fi
