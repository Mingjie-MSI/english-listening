<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日英语听力</title>
<meta name="description" content="托福难度英语听力每日训练：精听 + 泛听，每天 30 分钟">
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">🎧 每日英语听力</div>
  <div id="status" class="status"></div>
</header>

<nav class="tabs">
  <button data-tab="today" class="on">今天</button>
  <button data-tab="progress">进度</button>
  <button data-tab="history">记录</button>
  <button data-tab="settings">设置</button>
</nav>

<main>
  <section id="tab-today" class="tab on"></section>
  <section id="tab-progress" class="tab"></section>
  <section id="tab-history" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
</main>

<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
